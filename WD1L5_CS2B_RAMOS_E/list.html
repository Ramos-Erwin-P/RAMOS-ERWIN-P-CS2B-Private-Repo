<!DOCTYPE html>

<html>
  <head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="css/style.css">
  </head>

  <body>

		<h1>Grocery Item List</h1>
    <section id="grocerySection">
			
		
		<label>Item Name</label> <br>
		<input type="text" id="item_name"><br>
		
		<label>Quantity</label> <br>
		<input type="number" id="item_qty"> <br>
		
		<button class="btn-add" onclick="addItem()">Add Item</button>
		<button class="btn-clear" onclick="clearList()">Clear List</button>
		
		<br>

		<h2>List</h2>
		<ul id="groceryList"></ul>
	</section>

	<div class="page-footer">
      <button class="btn-logout" onclick="logout()">Log Out</button>
	</div>

	<script src="js/list.js"></script>
  </body>

</html>
