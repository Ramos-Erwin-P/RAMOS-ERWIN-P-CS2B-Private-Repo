<!DOCTYPE html>

<html>

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <h1>GroceryKo Sign Up</h1>
    
    <!--Make a User Registration Form-->

    <section id="registrationSection">

      <label>Full Name</label> <br>
        <input type="text" id="full_name" required> <br>

      <label>Address</label> <br>
        <input type="text" id="address" required> <br>

      <label>Username</label> <br>
        <input type="text" id="user_name" required> <br>

      <label>Email Address</label> <br>
        <input type="email" id="email" required> <br>

      <label>Password</label> <br>
        <input type="password" id="pword" required> <br>

      <button onclick="saveUserRecord()">Sign Up</button>
      <p id="regMessage"></p>

    </section>

    <p class="switch-link">Already have an account? <a href="login.html">Log in here</a> </p>

    <script src="js/reg.js"></script>

  </body>

</html>
